<!DOCTYPE html>
<!--
  The site's default language, and what a crawler reading the served document
  sees. Flutter rewrites this attribute once it boots and again whenever the
  visitor uses the switch in the nav bar.
-->
<html lang="en">

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description"
    content="Can Arslan — software developer. Flutter and Dart, on mobile and on the web. Open source packages on pub.dev.">
  <link rel="canonical" href="https://canarslan.me/">

  <!-- Matches the instrument canvas, so the browser chrome does not flash
       white before the app paints. -->
  <meta name="theme-color" content="#050605">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Can Arslan">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Favicon -->
  <link rel="icon" href="icon.png" type="image/png">

  <!--
    Social cards. These have to live here, in the served HTML: every crawler
    that builds a link preview reads the markup and none of them run Flutter,
    so nothing the app sets at runtime is ever seen. One consequence — every
    route shares this card, because every route is served this same file.

    Absolute URLs throughout. A relative og:image is not resolved by most
    crawlers and the preview comes out blank.

    og.png is generated by tool/og_card.py from the site's own palette, fonts
    and ASCII field. Regenerate it when the hero changes; a card that no longer
    matches the page it links to is worse than no card. Crawlers cache these
    hard, so changing the picture usually means changing the filename too.
  -->
  <meta property="og:site_name" content="Can Arslan">
  <meta property="og:title" content="Can Arslan — software developer">
  <meta property="og:description"
    content="Flutter and Dart, on mobile and on the web. Open source packages on pub.dev.">
  <meta property="og:image" content="https://canarslan.me/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Can Arslan — software developer">
  <meta property="og:url" content="https://canarslan.me/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Can Arslan — software developer">
  <meta name="twitter:description"
    content="Flutter and Dart, on mobile and on the web. Open source packages on pub.dev.">
  <meta name="twitter:image" content="https://canarslan.me/og.png">

  <!-- The engine and the fonts are on this origin; the three JSON APIs the
       site reads are not. Warming their connections overlaps the TLS
       handshakes with the app booting instead of following it. -->
  <link rel="preconnect" href="https://pub.dev" crossorigin>
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="preconnect" href="https://github-contributions-api.jogruber.de" crossorigin>

  <title>Can Arslan</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
