name: canarslan_website
version: 1.0.0+1
publish_to: none
environment:
  sdk: ^3.5.4
description: Personal website of Can Arslan — canarslan.me
dependencies:
  contributions_chart: ^1.0.0+4
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.16
  get: ^4.6.6
  google_fonts: ^6.2.1
  html: ^0.15.5
  http: ^1.2.2
  intl: ^0.20.2
  pointer_interceptor: ^0.10.1+2
  pubspec_dependency_sorter: ^1.0.5
  responsive_sizer: ^3.3.1
  very_good_analysis: ^6.0.0
  web: ^1.1.0
  widget_mask: ^1.0.0+0
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/notes/
    - assets/web/
    - assets/web/js/
    - assets/web/css/
    - assets/web/video/
  # SIGNAL design system faces. Clash Display + General Sans are bundled under
  # the Fontshare Free Font License (assets/fonts/LICENSE-Fontshare-FFL.txt),
  # JetBrains Mono under the SIL Open Font License.
  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Extralight.otf
          weight: 200
        - asset: assets/fonts/ClashDisplay-Semibold.otf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.otf
          weight: 700
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Regular.otf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.otf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
