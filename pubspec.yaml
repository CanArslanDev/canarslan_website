name: canarslan_website
version: 1.0.0+1
publish_to: none
environment:
  sdk: ^3.5.4
description: Personal website of Can Arslan — canarslan.me
dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  http: ^1.2.2
  web: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # The lint set analysis_options.yaml includes. A linter is a build-time tool
  # and has no business in the dependency graph the app ships from.
  very_good_analysis: ^6.0.0
flutter:
  uses-material-design: true
  # SIGNAL design system faces. Clash Display + General Sans are bundled under
  # the Fontshare Free Font License (assets/fonts/LICENSE-Fontshare-FFL.txt),
  # JetBrains Mono under the SIL Open Font License.
  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Extralight.otf
          weight: 200
        - asset: assets/fonts/ClashDisplay-Semibold.otf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.otf
          weight: 700
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Regular.otf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.otf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
